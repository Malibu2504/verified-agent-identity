- name: Checkout repo
  uses: actions/checkout@v3

- name: Cài đặt Node.js
  uses: actions/setup-node@v3
  with:
    node-version: '20'

- name: Cài đặt các thư viện cần thiết
  run: |
    cd scripts
    npm install

- name: Tạo Ethereum Identity
  run: node scripts/createNewEthereumIdentity.js

- name: Xem link xác minh Agent
  run: |
    node scripts/manualLinkHumanToAgent.js --challenge '{"name": "namchan", "description": "namchan AI Agent"}'
